<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículo - Glauco Kendi Itai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="cvscript.js" defer></script>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-user-gear"></i> Glauco Kendi Itai
            </a>
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">Início</a></li>
                    <li><a href="cursos-e-certificacoes.html" class="nav-link">Cursos & Certificações</a></li>
                    <li><a href="historico-profissional.html" class="nav-link">Histórico Profissional</a></li>
                    <li><a href="skills.html" class="nav-link">Skills</a></li>
                    <li><a href="projetos.html" class="nav-link">Projetos</a></li>
                    <li><a href="contatos.html" class="nav-link">Contatos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Barra de Ações Atualizada -->
<div class="cv-actions-bar">
    <a href="index.html" class="btn-toggle"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
    
    <!-- Link para download direto do PDF estático -->
    <a href="curriculo_glauco_kendi_itai 09-26.pdf" target="_blank" rel="noopener noreferrer" class="hero-btn print-btn">
    <i class="fa-solid fa-file-pdf"></i> Gera PDF
</a>
</div>

    <!-- Conteúdo do Currículo -->
    <main class="container cv-container">
        <article class="card cv-card">
            
            <!-- Seção do Perfil -->
            <header class="cv-header">
                <h1 id="cv-nome"></h1>
                <p class="cv-cargo" id="cv-cargo"></p>
                
                <div class="cv-contact-grid">
                    <span><i class="fa-solid fa-location-dot"></i> <span id="cv-localidade"></span></span>
                    <span><i class="fa-solid fa-envelope"></i> <a id="cv-email" href=""></a></span>
                    <span><i class="fa-solid fa-phone"></i> <span id="cv-telefone"></span></span>
                </div>
            </header>

            <hr class="cv-divider">

            <!-- Seção Resumo Profissional -->
            <section class="cv-section">
                <h2 class="section-title"><i class="fa-solid fa-user-tie"></i> Resumo Profissional</h2>
                <div class="bio-text" id="cv-sobre-mim"></div>
            </section>

            <hr class="cv-divider">

            <!-- Seção Histórico Profissional -->
            <section class="cv-section">
                <h2 class="section-title"><i class="fa-solid fa-briefcase"></i> Histórico Profissional</h2>
                <div class="timeline" id="cv-historico-container"></div>
            </section>

            <hr class="cv-divider">

            <!-- Seção Formação Acadêmica (2 colunas) -->
            <section class="cv-section">
                <h2 class="section-title"><i class="fa-solid fa-graduation-cap"></i> Formação Acadêmica</h2>
                <div class="academic-grid" id="cv-formacao-container"></div>
            </section>

            <hr class="cv-divider">

            <!-- Seção Cursos e Certificações (3 colunas) -->
            <section class="cv-section">
                <h2 class="section-title"><i class="fa-solid fa-certificate"></i> Cursos e Certificações</h2>
                <div class="courses-grid" id="cv-certificacoes-container"></div>
            </section>

            <hr class="cv-divider">

            <!-- Grid em Duas Colunas: Lado Esquerdo e Lado Direito -->
            <div class="cv-two-columns-grid">
    
                <!-- Coluna 1: Idiomas & Dados Complementares -->
                <div class="cv-column">
                    <!-- Seção Idiomas -->
                    <section class="cv-section">
                        <h2 class="section-title"><i class="fa-solid fa-globe"></i> Idiomas</h2>
                        <div id="cv-idiomas-container" class="idiomas-wrapper"></div>
                    </section>

                    <!-- Seção Dados Complementares -->
                    <section class="cv-section">
                        <h2 class="section-title"><i class="fa-solid fa-circle-info"></i> Dados Complementares</h2>
                        <div id="cv-dados-complementares-container" class="complementares-wrapper"></div>
                    </section>
                </div>

                <!-- Coluna 2: Cargos Desejados & Objetivos -->
                <div class="cv-column">
                    <!-- Seção Cargos Desejados -->
                    <section class="cv-section">
                        <h2 class="section-title"><i class="fa-solid fa-user-tie"></i> Cargos Desejados</h2>
                        <div id="cv-cargos-desejados-container" class="tags-container"></div>
                    </section>

                    <!-- Seção Objetivos -->
                    <section class="cv-section">
                        <h2 class="section-title"><i class="fa-solid fa-bullseye"></i> Objetivos</h2>
                        <div id="cv-objetivos-container" class="objetivos-wrapper"></div>
                    </section>
                </div>

            </div>
        </article>
    </main>

    <!-- Footer Section -->
    <footer>
        <div class="footer-content">
            <div class="footer-text">
                <h3 id="footer-nome"></h3>
                <p id="footer-titulo"></p>
            </div>
            <div class="social-links" id="social-container"></div>
        </div>
    </footer>

</body>
</html>
