<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico Profissional - Glauco Kendi Itai</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Externo -->
    <link rel="stylesheet" href="style.css">
    <!-- Script JS -->
    <script src="script-historico.js" defer></script>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div id="header-holder"></div>
    </header>

    <!-- Page Banner -->
    <section class="hero">
        <div class="hero-content">
            <h1>Histórico Profissional</h1>
            <p>Trajetória em liderança de projetos, metodologias ágeis e governança de TI</p>
        </div>
    </section>

    <!-- Main Content Container -->
    <main class="container">
        <div class="card">
            <h2 class="section-title"><i class="fa-solid fa-briefcase"></i> Experiência Profissional</h2>

            <!-- Timeline Dinâmica consumida via JSON -->
            <div class="timeline" id="timeline-container"></div>
        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        <div id="footer-holder"></div>
    </footer>
    <script src="script-contatos.js" defer></script>

</body>
</html>
