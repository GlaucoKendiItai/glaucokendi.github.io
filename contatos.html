<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos & Recados - Glauco Kendi Itai</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Externo -->
    <link rel="stylesheet" href="style.css">
    <!-- Script de Injeção e Consumo -->
    <script src="script-contatos.js" defer></script>
</head>
<body>

    <!-- Contêiner do Header Reutilizável -->
    <div id="header-holder"></div>

    <!-- Page Banner -->
    <section class="hero">
        <div class="hero-content">
            <h1>Entre em Contato</h1>
            <p>Canais diretos de comunicação e espaço interativo para recados e networking</p>
        </div>
    </section>

    <!-- Main Content Container -->
    <main class="container">
        
        <!-- Seção de Cartões de Contato (Gerado via JSON) -->
        <div class="card">
            <h2 class="section-title"><i class="fa-solid fa-address-book"></i> Canais de Comunicação</h2>
            <div class="contact-grid" id="contact-grid-container"></div>
        </div>

        <!-- Seção do Fórum Disqus -->
        <div class="card">
            <h2 class="section-title"><i class="fa-solid fa-comments"></i> Mural de Recados e Fórum</h2>
            <p style="margin-bottom: 1.5rem; color: var(--text-light, #64748b);">Deixe sua mensagem ou dúvida técnica abaixo. O fórum é aberto a todos os visitantes:</p>

            <!-- Contêiner do Disqus -->
            <div id="disqus_thread"></div>

            <script>
                var disqus_config = function () {
                    this.page.url = window.location.href;  
                    this.page.identifier = 'contatos_glauco_kendi'; 
                };
                
                (function() { 
                    var d = document, s = d.createElement('script');
                    s.src = 'https://glauco-portfolio.disqus.com/embed.js';
                    s.setAttribute('data-timestamp', +new Date());
                    (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Por favor, ative o JavaScript para visualizar os <a href="https://disqus.com/?ref_noscript">comentários do Disqus.</a></noscript>
        </div>

    </main>

    <!-- Contêiner do Footer Reutilizável -->
    <div id="footer-holder"></div>

</body>
</html>
