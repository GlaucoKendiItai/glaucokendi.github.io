<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos e Certificações - Glauco Kendi Itai</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Externo -->
    <link rel="stylesheet" href="style.css">
    <!-- Script de Injeção de Dados -->
    <script src="script-certificacoes.js" defer></script>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div id="header-holder"></div>
    </header>

    <!-- Page Banner -->
    <section class="hero">
        <div class="hero-content">
            <h1>Cursos e Certificações</h1>
            <p>Aprimoramento contínuo e validação de conhecimentos em gestão e tecnologia</p>
        </div>
    </section>

    <!-- Main Content Container -->
    <main class="container">

        <!-- Formação Acadêmica -->
        <div class="card">
            <h2 class="section-title"><i class="fa-solid fa-award"></i> Formação Acadêmica</h2>
            <div class="certs-grid" id="formacao-academica-grid"></div>
        </div>

        <!-- Certificações & Formações -->
        <div class="card">
            <h2 class="section-title"><i class="fa-solid fa-award"></i> Certificações & Formações</h2>
            <div class="certs-grid" id="certificacoes-grid"></div>
        </div>

    </main>

    <!-- Footer Section -->
    <footer>
        <div id="footer-holder"></div>
    </footer>
    <script src="script-contatos.js" defer></script>

</body>
</html>
